<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Support Chat</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 560px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        #log {
            display: grid;
            gap: .5rem;
            margin-bottom: 1rem;
        }

        .msg {
            padding: .5rem .75rem;
            border-radius: 8px;
            margin: 0;
        }

        .user {
            background: #e8f0fe;
            justify-self: end;
        }

        .ai {
            background: #f1f3f4;
        }

        .error {
            color: #b3261e;
        }

        form {
            display: flex;
            gap: .5rem;
            align-items: center;
        }

        input {
            flex: 1;
            padding: .5rem;
        }
    </style>
</head>

<body>
    <h1>Support Chat</h1>
    <div id="log" role="log" aria-label="Conversation"></div>
    <p id="status" role="status"></p>
    <form id="chat">
        <label for="question">Your question</label>
        <input id="question" maxlength="500" autocomplete="off">
        <button type="submit">Send</button>
    </form>
    <script>
        const log = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const form = document.getElementById('chat');
        const input = document.getElementById('question');
        const button = form.querySelector('button');

        function addMessage(text, who) {
            const p = document.createElement('p');
            p.className = 'msg ' + who;
            p.dataset.test = who === 'ai' ? 'ai-message' : 'user-message';
            p.textContent = text; // plain text, never HTML: AI output is untrusted
            log.append(p);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = input.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            input.value = '';
            button.disabled = true;
            statusEl.className = '';
            statusEl.textContent = 'Thinking…';
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });
                if (!response.ok) throw new Error('status ' + response.status);
                const data = await response.json();
                addMessage(data.reply, 'ai');
                statusEl.textContent = '';
            } catch (error) {
                statusEl.className = 'error';
                statusEl.textContent = 'Sorry, the assistant is unavailable. Please try again.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>

</html>
